name: PR CI

on:
  pull_request:
    branches: [dev]

# 같은 PR에 연속 push 시 이전 CI 취소
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: 단위 테스트 실행
        run: ./gradlew test --no-daemon

  claude-review:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude AI Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 PR에서 변경된 코드를 한국어로 리뷰해줘.
            버그, 보안 문제, 이 저장소의 CLAUDE.md에 정리된 코드 스타일 위반 여부를 중심으로 확인하고,
            문제가 없으면 그렇다고 짧게 알려줘.
          use_sticky_comment: 'true'
          include_fix_links: 'true'
          show_full_output: 'true'
