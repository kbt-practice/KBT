name: PR CI

on:
  pull_request:
    branches: [dev]

# 같은 PR에 연속 push 시 이전 CI 취소
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: 단위 테스트 실행
        run: ./gradlew test --no-daemon

  claude-review:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude AI Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 한국어로 리뷰해줘. PR 브랜치는 이미 현재 작업 디렉토리에 체크아웃되어 있어.

            ## 리뷰 범위 (토큰 절약)
            - 변경된 파일의 diff에만 집중해. diff와 무관한 파일이나 전체 코드베이스를 탐색하지 마.
            - CLAUDE.md는 스타일 규칙 확인에 필요한 부분만 읽어.
            - 파일당 심각도 높은 순으로 최대 5개 이슈까지만 다뤄.

            ## 확인할 것
            - 버그 가능성
            - 보안 문제
            - CLAUDE.md에 정리된 코드 스타일 위반 여부

            ## 댓글 방식
            - 인라인 코멘트(`mcp__github_inline_comment__create_inline_comment`, confirmed: true)는 Critical/High 이슈에만 사용해. Medium 이하는 인라인 남기지 말고 요약 표 개수로만 집계해.
            - 전체 요약은 아래 형식 그대로 `gh pr comment`로 딱 하나만 남겨.
            - 반드시 GitHub 댓글로 남겨. 메시지로만 답하지 마.

            ## 요약 댓글 형식 (이 구조 그대로)
            ## 🤖 Claude AI 코드 리뷰

            **리뷰 타입:** 🔍 full
            **검토한 파일:** {N}개
            **발견된 이슈:** {합계}개

            ### 📋 리뷰 요약

            | 심각도 | 개수 | 설명 |
            |--------|------|------|
            | 🔴 **Critical** | {n} | 즉시 수정이 필요한 심각한 문제 |
            | 🟠 **High** | {n} | 중요한 문제, 빠른 수정 권장 |
            | 🟡 **Medium** | {n} | 일반적인 개선 사항 |

            ### 📁 파일별 상세 리뷰

            파일마다 접이식으로:

            <details>
            <summary><b>{파일경로}</b> ({이슈수}개 이슈)</summary>

            - **{파일경로}:{라인}** — [심각도] CLAUDE.md 「{섹션명}」 위반
              - 코드: `{실제 코드}`
              - 이유: {한 줄 설명}

            </details>
          claude_args: |
            --max-turns 15
            --model claude-sonnet-4-6