name: PR CI

on:
  pull_request:
    branches: [dev]

# 같은 PR에 연속 push 시 이전 CI 취소
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: 단위 테스트 실행
        run: ./gradlew test --no-daemon

  claude-review:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude AI Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 한국어로 리뷰해줘. 다음을 중심으로 확인해:
            - 버그 가능성
            - 보안 문제
            - 이 저장소 CLAUDE.md에 정리된 코드 스타일 위반 여부

            PR 브랜치는 이미 현재 작업 디렉토리에 체크아웃되어 있어.

            전체적인 피드백은 `gh pr comment`로 남겨줘.
            특정 코드 라인을 지적할 때는 `mcp__github_inline_comment__create_inline_comment`(`confirmed: true`)를 사용해줘.
            리뷰 내용을 메시지로만 답하지 말고 반드시 GitHub 댓글로 남겨야 해.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
