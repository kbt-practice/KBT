name: Claude Code Review

# PR 이벤트에 바로 반응하지 않고, PR CI(ci-pr.yml)가 성공적으로 끝난 뒤에만 실행한다.
on:
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]

jobs:
  claude-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: read

    steps:
      - name: PR CI가 검증한 커밋 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # chimaek/claude-code-review-action은 GITHUB_EVENT_NAME이 'pull_request'이고
      # GITHUB_EVENT_PATH에 pull_request.number가 있어야 리뷰 대상을 찾는다.
      # workflow_run으로 트리거하면 이 값들이 없어서, PR CI 실행에 연결된 PR 번호로 이벤트 파일을 직접 만들어 넘겨준다.
      - name: pull_request 이벤트 페이로드 생성
        id: pr-event
        run: |
          EVENT_PATH="$RUNNER_TEMP/pr-event.json"
          echo '{"pull_request": {"number": ${{ github.event.workflow_run.pull_requests[0].number }}}}' > "$EVENT_PATH"
          echo "path=$EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Claude AI Code Review
        uses: chimaek/claude-code-review-action@master
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: ${{ steps.pr-event.outputs.path }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugins: 'code-review@claude-code-plugins'
          prompt: '코드 리뷰해줘'
          file_patterns: "src/**/*.{js,ts},Dockerfile,**/*.yaml"
          review_type: full
          language: ko
          max_files: 5
          max_issues_per_file: 5
          severity_filter: medium
