name: Claude Code Review

# dev로 향하는 PR(feat/fix 서브 브랜치)에서만 동작한다.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: read
      checks: read

    steps:
      # PR CI(ci-pr.yml)의 test 체크가 success로 끝날 때까지 대기한 뒤에만 리뷰를 진행한다.
      - name: PR CI 성공 대기
        uses: lewagon/wait-on-check-action@v1.9.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude AI Code Review
        uses: chimaek/claude-code-review-action@master
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugins: 'code-review@claude-code-plugins'
          prompt: '코드 리뷰해줘'
          file_patterns: "src/**/*.{js,ts},Dockerfile,**/*.yaml"
          review_type: full
          language: ko
          max_files: 5
          max_issues_per_file: 5
          severity_filter: medium
