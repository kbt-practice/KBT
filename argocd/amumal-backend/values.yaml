replicaCount: 2

# 리소스 이름 (Deployment와 Service 이름이 다르므로 분리)
deploymentName: amumal-deployment
serviceName: spring-clusterip

# 3중 라벨 - selector / template / antiAffinity 전부 이거 하나 참조
labels:
  app: amumal
  tier: backend
  env: prod

image:
  repository: mingkiboo/amumal-amon
  tag: aa7c36cd9b826f039430b3a43cd4ad92b8db1686
  pullPolicy: IfNotPresent

# 이미 backend-ns에 만들어둔 secret 참조
imagePullSecret: regcred
envSecret: amumal-env

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

monitoring:
  enabled: true
  path: /actuator/prometheus
  interval: 30s
  scrapeTimeout: 10s

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1280Mi

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

gracefulShutdown:
  preStopDelaySeconds: 10
  terminationGracePeriodSeconds: 30

probes:
  port: 8080
  startupPath: /actuator/health
  readinessPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness

gateway:
  name: amumal-gateway
  namespace: edge-ns
  sectionName: https
host: api.sub.amon.p-e.kr
