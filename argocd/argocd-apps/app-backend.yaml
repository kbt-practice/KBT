apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amumal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kbt-practice/KBT.git
    targetRevision: main
    path: amumal-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: backend-ns
  syncPolicy:
    syncOptions: [ "CreateNamespace=false" ]
    automated: { prune: true, selfHeal: true }
