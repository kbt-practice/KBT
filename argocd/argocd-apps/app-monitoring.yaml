apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amumal-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/kbt-practice/KBT.git
    targetRevision: main
    path: argocd/monitoring-chart
    helm:
      releaseName: argocd/amumal-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-ns
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: false
