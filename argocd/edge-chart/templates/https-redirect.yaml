apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayName }}
      namespace: {{ .Release.Namespace }}
      sectionName: http
  hostnames:
    - "api.{{ .Values.domainBase }}"
    - "portainer.{{ .Values.domainBase }}"
    - "argocd.{{ .Values.domainBase }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301