apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
spec:
  parentRefs:
    - name: {{ .Values.grafanaRoute.gateway.name }}
      namespace: {{ .Values.grafanaRoute.gateway.namespace }}
      sectionName: {{ .Values.grafanaRoute.gateway.sectionName }}
  hostnames:
    - {{ .Values.grafanaRoute.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.grafanaRoute.serviceName }}
          port: {{ .Values.grafanaRoute.servicePort }}
