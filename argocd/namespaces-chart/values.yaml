# =====================================================================
# 네임스페이스별 quota/limitrange 정의
#  - templates/namespaces.yaml 에서 range로 반복 생성
#  - 새 ns 추가 시 여기 항목만 추가하면 됨
# =====================================================================
namespaces:
  - name: backend-ns
    quota:
      pods: "3"
      requests.cpu: "300m"
      requests.memory: 1536Mi
      limits.cpu: "3"
      limits.memory: 3840Mi
    limitRange:
      defaultRequest: { cpu: 100m, memory: 512Mi }
      default:        { cpu: 1000m, memory: 1280Mi }

  - name: edge-ns
    quota:
      pods: "4"
      requests.cpu: "100m"
      requests.memory: 128Mi
      limits.cpu: "600m"
      limits.memory: 320Mi
    limitRange:
      defaultRequest: { cpu: 10m, memory: 32Mi }
      default:        { cpu: 100m, memory: 64Mi }

  - name: portainer-ns
    quota:
      # 상시 2개(provisioner+statefulset) + 둘 다 동시 롤링업데이트 surge 2개 + PVC 신규 생성 시 helper-pod 1개
      pods: "5"
      requests.cpu: "250m"
      requests.memory: 320Mi
      limits.cpu: "1"
      limits.memory: 700Mi
    limitRange:
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default:        { cpu: 200m, memory: 128Mi }

  - name: monitoring-ns
    quota:
      pods: "30"
      requests.cpu: "6"
      requests.memory: 12Gi
      limits.cpu: "20"
      limits.memory: 24Gi
    limitRange:
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default:        { cpu: 1000m, memory: 1Gi }
