apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: portainer-ip-allowlist
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: portainer-route
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-my-ip
        action: Allow
        principal:
          clientCIDRs:
            - {{ .Values.allowedCIDR }}
