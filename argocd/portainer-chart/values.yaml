# =====================================================================
# amumal-portainer 차트 values
# =====================================================================

# 리소스 이름 (deployment 이름이 레거시라 명시적으로 분리)
deploymentName: portainer-statefulset   # 이름은 레거시, 실제 kind는 Deployment
serviceName: portainer-clusterip

# 3중 라벨 - selector / template 전부 이거 참조
labels:
  app: amumal
  tier: portainer
  env: prod

replicaCount: 1

image:
  repository: portainer/portainer-k8s-beta
  tag: linux-amd64
  pullPolicy: IfNotPresent

serviceAccount:
  name: portainer-sa

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  port: 9000
  path: /

# Local Path Provisioner
localPathProvisioner:
  enabled: true
  name: portainer-local-path-provisioner
  image:
    repository: rancher/local-path-provisioner
    tag: v0.0.31
    pullPolicy: IfNotPresent
  helperImage: busybox:1.36.1
  storageClass:
    name: portainer-local-path
    isDefaultClass: false
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
  nodePath: /data/local-path-provisioner
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Portainer 데이터 PVC (Local Path Provisioner가 PV를 동적으로 생성)
persistence:
  storageClassName: portainer-local-path
  # 기존 정적 PVC와의 immutable 필드 충돌을 피하기 위해 새 이름을 사용한다.
  claimName: portainer-data-local-path
  size: 1Gi

# Gateway 연동 (route)
gateway:
  name: amumal-gateway
  namespace: edge-ns
  sectionName: https
host: portainer.sub.amon.p-e.kr

# IP 화이트리스트 (portainer는 잠겨도 argocd로 접근 가능 -> 차트 포함 안전)
allowedCIDR: 211.244.225.224/32
