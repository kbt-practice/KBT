spring.application.name=amumal

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO_SET}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# AWS S3
aws.credentials.access-key=${AWS_ACCESS_KEY}
aws.credentials.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# Access Token: 1시간(ms), Refresh Token: 30일(ms)
jwt.expiration_time=3600000
jwt.refresh_expiration_time=2592000000
jwt.secret=${JWT_SECRET}

server.forward-headers-strategy=framework

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Elasticsearch (nori 커스텀 이미지, 클러스터 내부 통신이라 보안 기능은 비활성화 상태로 운용)
spring.elasticsearch.uris=http://${ES_HOST:localhost}:${ES_PORT:9200}
spring.elasticsearch.username=${ES_USERNAME:}
spring.elasticsearch.password=${ES_PASSWORD:}
search.enabled=${SEARCH_ENABLED:true}
search.sync.fixed-delay-ms=${SEARCH_SYNC_FIXED_DELAY_MS:300000}
search.sync.batch-size=${SEARCH_SYNC_BATCH_SIZE:500}
search.initial-index.enabled=${SEARCH_INITIAL_INDEX_ENABLED:false}

# 검색 가중치: 주제를 압축하는 제목을 가장 높게 두고 본문·댓글을 보조 신호로 사용한다
search.boost.title=4.0
search.boost.content=2.0
search.boost.comments=1.0

# 오타를 허용하는 정도 (nori 토큰 단위 Levenshtein 거리, AUTO = 토큰 길이에 따라 자동 조정)
search.fuzziness=AUTO
search.fuzzy.max-expansions=25
search.fuzzy.prefix-length=0

# JSON 직렬화 타임존
spring.jackson.time-zone=Asia/Seoul

springdoc.enable-data-rest=false
server.url=${SERVER_URL}

# 로그 파일 이름 설정
logging.file.name=/home/ubuntu/KBT/amumal/logs/app.log

# 로그 레벨 설정
logging.level.root=INFO
logging.level.com.kbt.amumal=${APP_LOG_LEVEL:INFO}

# GlobalExceptionHandler에서 이미 에러를 로깅하므로 스프링 기본 중복 로그는 끄기
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF

# 하루 단위로 로그를 쪼개기 -> 최대 7일치만 보관, 나머지 삭제
logging.logback.rollingpolicy.max-history=7

# 파일 한 개당 최대 10MB까지만 커지게 제한 (넘으면 .gz 압축)
logging.logback.rollingpolicy.max-file-size=10MB

# 패턴 설정
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 롤링 업데이트 수정
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
